name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  verify:
    name: Full iPhone and iPad regression
    environment: >-
      ${{ github.actor == github.repository_owner
          && github.triggering_actor == github.repository_owner
          && (github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request'
                  && github.event.pull_request.user.login == github.repository_owner
                  && github.event.pull_request.head.repo.full_name == github.repository))
          && 'local-ci-owner' || 'local-ci' }}
    runs-on: [self-hosted, macOS, ARM64, justmarkdown]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show local toolchain
        run: |
          id -un
          xcodebuild -version
          xcrun simctl list runtimes
          python3 --version
          node --version
      - name: Scan the working tree and Git history for credentials
        run: |
          gitleaks_digest=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          mkdir -p "$RUNNER_TOOL_CACHE"
          gitleaks_archive="$RUNNER_TOOL_CACHE/gitleaks_8.30.1_darwin_arm64.tar.gz"
          if [ ! -f "$gitleaks_archive" ]; then
            curl --fail --silent --show-error --location \
              'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz' \
              --output "$RUNNER_TEMP/gitleaks.tar.gz"
            printf '%s  %s\n' "$gitleaks_digest" "$RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 --check
            mv "$RUNNER_TEMP/gitleaks.tar.gz" "$gitleaks_archive"
          fi
          printf '%s  %s\n' "$gitleaks_digest" "$gitleaks_archive" | shasum -a 256 --check
          tar -xzf "$gitleaks_archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact=100
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --no-banner --redact=100
      - name: Check offline resources and project files
        run: |
          python3 scripts/build_native_web.py --check --audit-dependencies
          for script in reader agent localization; do
            node --check "MarkdownIt/Resources/Web/$script.js"
          done
          python3 -m compileall -q scripts
          plutil -lint MarkdownIt/Info.plist MarkdownIt/PrivacyInfo.xcprivacy MarkdownIt.xcodeproj/project.pbxproj
          xcrun swift-format lint --strict --recursive --configuration .swift-format MarkdownIt MarkdownItTests MarkdownItUITests MarkdownItLiveTests scripts
      - name: Check Python tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/python-tools"
          "$RUNNER_TEMP/python-tools/bin/pip" install ruff==0.14.14
          "$RUNNER_TEMP/python-tools/bin/ruff" check scripts
          "$RUNNER_TEMP/python-tools/bin/ruff" format --check scripts
          python3 -m unittest discover -s scripts/tests
      - name: Compile iPhoneOS Release
        run: >-
          xcodebuild -project MarkdownIt.xcodeproj -scheme MarkdownIt
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/Release" CODE_SIGNING_ALLOWED=NO build
      - name: Compile live-model tests without making requests
        run: >-
          xcodebuild -project MarkdownIt.xcodeproj -scheme MarkdownItLive
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LiveTestBuild" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run all offline tests on iPhone and iPad
        timeout-minutes: 30
        run: >-
          caffeinate -i python3 scripts/verify_ios.py
          --simulator-prefix 'MarkdownIt CI'
          --runtime 26.5
          --output "$RUNNER_TEMP/native-tests"
      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["RUNNER_TEMP"]) / "native-tests/results.json"
          if results.is_file():
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write("| Simulator | Result | Passed | Failed | Skipped | Test execution |\n")
                  summary.write("| --- | --- | ---: | ---: | ---: | ---: |\n")
                  for result in json.loads(results.read_text()):
                      counts = result.get("testCounts") or {}
                      status = "Passed" if result["passed"] else "Failed"
                      seconds = result.get("executionSeconds")
                      duration = f"{seconds:.1f}s" if seconds is not None else "—"
                      summary.write(
                          f"| {result['family']} | {status} | {counts.get('passedTests', '—')} "
                          f"| {counts.get('failedTests', '—')} | {counts.get('skippedTests', '—')} "
                          f"| {duration} |\n"
                      )
          PYTHON
      - name: Retain test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-results
          path: |
            ${{ runner.temp }}/native-tests/*.log
            ${{ runner.temp }}/native-tests/results.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain full failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-diagnostics
          path: ${{ runner.temp }}/native-tests/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
