<aside class="mdv-agent" data-component="QuestionPanel" aria-label="AI conversation" data-l10n-aria-label="AI conversation" hidden>
  <div class="mdv-agent-grabber" aria-hidden="true"><span></span></div>
  <button type="button" data-agent-action="collapse" data-reader-chrome class="mdv-agent-collapse cursor-interaction" aria-label="Collapse conversation" data-l10n-aria-label="Collapse conversation"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
  <div class="mdv-agent-scroll" role="region" aria-label="Conversation" data-l10n-aria-label="Conversation">
    <div class="mdv-conversation" data-component="ConversationThread" aria-label="Conversation thread" data-l10n-aria-label="Conversation thread"></div>
  </div>
  <form class="mdv-composer" data-component="ConversationComposer">
    <div class="mdv-composer-reference" data-component="ContextAttachment" role="group" aria-label="Reference" data-l10n-aria-label="Reference" hidden></div>
    <label class="mdv-sr-only" for="mdv-question-input" data-l10n="Ask a question or follow up">Ask a question or follow up</label>
    <div class="mdv-composer-input-row">
      <textarea id="mdv-question-input" class="mdv-agent-input" aria-label="Ask a question or follow up" data-l10n-aria-label="Ask a question or follow up" rows="1" spellcheck="false" enterkeyhint="enter"></textarea>
      <div class="mdv-composer-footer">
        <button type="submit" class="mdv-agent-send cursor-interaction" aria-label="Send message" data-l10n-aria-label="Send message" disabled><i data-lucide="arrow-up" aria-hidden="true"></i></button>
      </div>
    </div>
  </form>
  <p class="mdv-agent-announcement mdv-sr-only" role="status" aria-live="polite"></p>
</aside>
