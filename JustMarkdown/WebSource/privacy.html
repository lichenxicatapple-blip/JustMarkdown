<!doctype html>
<html lang="<!-- policy-language -->">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>JustMarkdown</title>
  <style>
    :root { color-scheme: light dark; font: -apple-system-body; -webkit-text-size-adjust: 100%; }
    body { margin: 0; color: CanvasText; background: Canvas; line-height: 1.6; overflow-wrap: anywhere; }
    main { max-width: 42rem; margin: 0 auto; padding: 20px 24px 40px; }
    main > p:first-child { color: GrayText; font-size: .85em; }
    h3 { margin: 1.8em 0 .65em; font-size: 1.15em; line-height: 1.4; }
    p, ul { margin: 0 0 1em; }
    ul { padding-inline-start: 1.3em; }
    li + li { margin-top: .5em; }
    a { color: LinkText; }
    table { width: 100%; margin: 1em 0; border-collapse: collapse; font-size: .9em; }
    th, td { padding: .7em .5em; text-align: start; vertical-align: top; border-bottom: 1px solid light-dark(#d1d1d6, #48484a); }
    th:first-child, td:first-child { width: 29%; padding-inline-start: 0; }
    th:last-child, td:last-child { padding-inline-end: 0; }
  </style>
</head>
<body>
  <main id="privacy-policy"><!-- policy-content --></main>
</body>
</html>
